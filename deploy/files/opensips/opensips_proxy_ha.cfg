#
# OpenSIPS GB28181 HA 代理 - 主入口
# 节点 1 / 节点 2 共用
# 详细设计见 docs/superpowers/specs/2026-07-28-opensips-gb28181-ha-design.md
#

########### 全局参数 ##########
log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=yes
syslog_facility=LOG_LOCAL0
udp_workers=4

# 节点特定参数
include_file "/etc/opensips/local.cfg"

########### 模块路径 + 加载 ##########
mpath="/usr/local/lib64/opensips/modules/"

# HA 模块
loadmodule "proto_bin.so"
loadmodule "clusterer.so"
loadmodule "httpd.so"

# DB 驱动
loadmodule "db_sqlite.so"
loadmodule "sqlops.so"
loadmodule "db_text.so"

# JSON 解析
loadmodule "json.so"

# 核心 SIP
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)

loadmodule "rr.so"
modparam("rr", "append_fromtag", 0)

loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "acc.so"
loadmodule "uac.so"
loadmodule "nathelper.so"
loadmodule "xml.so"

# proto
loadmodule "proto_udp.so"

# MI FIFO
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0666)

########### HA modparam ##########

# === usrloc: full-sharing-cluster 模式 ===
modparam("usrloc", "working_mode_preset", "full-sharing-cluster")
modparam("usrloc", "db_url", "sqlite:///var/lib/opensips/opensips.db")
modparam("usrloc", "use_domain", false)
modparam("usrloc", "nat_bflag", "NAT")
modparam("usrloc", "location_cluster", 1)
modparam("usrloc", "skip_replicated_db_ops", 0)

# === dispatcher: by-shtag ===
modparam("dispatcher", "db_url", "text:///etc/opensips/dbtext/dispatcher")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_from", "20.20.136.100:5060")
modparam("dispatcher", "ds_probing_threshhold", 3)
modparam("dispatcher", "cluster_id", 1)
modparam("dispatcher", "cluster_sharing_tag", "sip_active")
modparam("dispatcher", "cluster_probing_mode", "by-shtag")

# === clusterer ===
modparam("clusterer", "db_url", "sqlite:///var/lib/opensips/opensips.db")
modparam("clusterer", "db_mode", 1)
modparam("clusterer", "ping_interval", 2)
modparam("clusterer", "ping_timeout", 1)
modparam("clusterer", "node_timeout", 5)
modparam("clusterer", "sync_timeout", 500)
# my_node_id / neighbor_node_info 由 local.cfg.nodeX 设置

# === httpd ===
# 节点 1 / 节点 2 都监听 8080，运行时由 HA 状态决定扮演 client 还是 server
# 实际 IP 由 local.cfg.nodeX 覆盖
modparam("httpd", "port", 8080)

# === nathelper ===
modparam("nathelper", "nortpproxy_str", "")

# === db_text ===
modparam("db_text", "db_mode", 1)

########### 业务路由（节点共用）##########
include_file "/etc/opensips/opensips_ha_routes.cfg"

########### 启动路由 ##########
startup_route {
    sql_query("CREATE TABLE IF NOT EXISTS location (
        contact_id INTEGER PRIMARY KEY AUTOINCREMENT NOT NULL,
        username CHAR(64) DEFAULT '' NOT NULL,
        domain CHAR(64) DEFAULT NULL,
        contact TEXT NOT NULL,
        received CHAR(255) DEFAULT NULL,
        path CHAR(255) DEFAULT NULL,
        expires INTEGER NOT NULL,
        q FLOAT(10,2) DEFAULT 1.0 NOT NULL,
        callid CHAR(255) DEFAULT 'Default-Call-ID' NOT NULL,
        cseq INTEGER DEFAULT 13 NOT NULL,
        last_modified DATETIME DEFAULT '1900-01-01 00:00:01' NOT NULL,
        flags INTEGER DEFAULT 0 NOT NULL,
        cflags CHAR(255) DEFAULT NULL,
        user_agent CHAR(255) DEFAULT '' NOT NULL,
        socket CHAR(64) DEFAULT NULL,
        methods INTEGER DEFAULT NULL,
        sip_instance CHAR(255) DEFAULT NULL,
        kv_store TEXT(512) DEFAULT NULL,
        attr CHAR(255) DEFAULT NULL
    )");
    xlog("L_INFO", "HA: startup on node $cluster.my_node_id (cluster_id=1)\n");
}

########### event_route: clusterer 状态变化（仅日志）##########
event_route[clusterer:my-node-status] {
    if ($clustermode == 1) {
        xlog("L_INFO", "HA: node $cluster.my_node_id promoted to ACTIVE\n");
    } else {
        xlog("L_WARN", "HA: node $cluster.my_node_id demoted to STANDBY\n");
    }
}

event_route[clusterer:node-failure] {
    xlog("L_ERR", "HA: neighbor node $cluster.elected_node_id lost\n");
}

event_route[clusterer:node-rejoin] {
    xlog("L_INFO", "HA: neighbor node $cluster.elected_node_id rejoined\n");
}

########### event_route: HTTP 重放接收 ##########
event_route[http:request] {
    if ($hdrc(method) == "POST" && $hdrc(path) == "/replay/channel") {
        route(replay_channel);
        exit;
    }
    xlog("L_WARN", "HTTP: unknown path $hdrc(path)\n");
    $http_reply(404, "Not Found", "", "");
}
