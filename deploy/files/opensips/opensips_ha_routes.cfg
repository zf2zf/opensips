#
# OpenSIPS GB28181 HA - 业务路由
# 基于 etc/opensips_proxy.cfg 改造：HA 模式下 route[process_catalog] 增加 HTTP 重放
#

########### 工具路由 ##########

route[maxfwd] {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        return -1;
    }
    return 1;
}

route[dedup] {
    t_check_trans();
    return 1;
}

route[relay] {
    forward();
    exit;
}

########### HTTP 重放接收端 ##########
# 接收 active 节点推送的 JSON，写本地 SQLite
route[replay_channel] {
    $var(body) = $rb;

    if ($var(body) == NULL || $(var(body){s.len}) == 0) {
        $http_reply(400, "Bad Request", "Content-Type: text/plain", "empty body");
        exit;
    }

    json_get_field("$var(body)", "op", "$var(op)");

    if ($var(op) == "delete") {
        # 解析 where.username 或 where.attr_like
        json_get_field("$var(body)", "where.username", "$var(username)");
        if ($var(username) != NULL) {
            sql_query("DELETE FROM location WHERE username='" + $var(username) + "'");
            $http_reply(200, "OK", "Content-Type: text/plain", "deleted");
            xlog("L_INFO", "REPLAY: delete username=$var(username)\n");
        } else {
            json_get_field("$var(body)", "where.attr_like", "$var(attr_like)");
            if ($var(attr_like) != NULL) {
                sql_query("DELETE FROM location WHERE attr LIKE '" + $var(attr_like) + "'");
                $http_reply(200, "OK", "Content-Type: text/plain", "deleted");
                xlog("L_INFO", "REPLAY: delete attr_like=$var(attr_like)\n");
            } else {
                $http_reply(400, "Bad Request", "Content-Type: text/plain", "missing where");
            }
        }
    } else if ($var(op) == "insert") {
        json_get_field("$var(body)", "row.username", "$var(username)");
        json_get_field("$var(body)", "row.domain", "$var(domain)");
        json_get_field("$var(body)", "row.contact", "$var(contact)");
        json_get_field("$var(body)", "row.user_agent", "$var(user_agent)");
        json_get_field("$var(body)", "row.socket", "$var(socket)");
        json_get_field("$var(body)", "row.attr", "$var(attr)");
        json_get_field("$var(body)", "row.callid", "$var(callid)");

        if ($var(username) == NULL || $var(username) == "") {
            $http_reply(400, "Bad Request", "Content-Type: text/plain", "missing row.username");
            exit;
        }

        sql_query("INSERT INTO location (username, domain, contact, expires, q, callid, cseq, last_modified, flags, user_agent, socket, attr) "
            + "VALUES ('" + $var(username) + "', '"
            + ($var(domain) ?: "") + "', '"
            + ($var(contact) ?: "") + "', 1790000000, -1.0, '"
            + ($var(callid) ?: "") + "', 9999, datetime('now', 'localtime'), 0, '"
            + ($var(user_agent) ?: "") + "', '"
            + ($var(socket) ?: "") + "', '"
            + ($var(attr) ?: "") + "')");
        $http_reply(200, "OK", "Content-Type: text/plain", "inserted");
        xlog("L_INFO", "REPLAY: insert username=$var(username)\n");
    } else {
        $http_reply(400, "Bad Request", "Content-Type: text/plain", "unknown op");
    }
}

########### 注册处理（HA 改造：注销级联删除走 HTTP 重放）##########

route[register] {
    $avp(expires_hdr) = $hdr(Expires);
    fix_nated_contact();

    if (!save("location", "no-reply"))
        xlog("L_ERR", "REGISTER: failed for $tu\n");

    # 设备注销时：级联删除该设备的所有子通道
    if ($avp(expires_hdr) == "0") {
        sql_query("DELETE FROM location WHERE attr LIKE '%' || '$tu' || '%'");
        xlog("L_INFO", "REGISTER: child channels cleaned for $tu\n");

        # HA: HTTP 异步重放到对端
        if ($clustermode == 1) {
            $var(repl_body) = "{\"op\":\"delete\",\"where\":{\"attr_like\":\"%" + $tu + "%\"}}";
            http_async_query("http://20.20.136.67:8080/replay/channel",
                $var(repl_body), "replay_unreg_" + $tu);
        }
    }

    t_on_reply("handle_nat");
    if (ds_select_dst(1, 0, "f"))
        t_relay();
    else
        sl_send_reply(503, "Service Unavailable");
    return 1;
}

########### MESSAGE 处理（与单机版一致）##########

route[message] {
    if ($hdr(Content-Type) == "Application/MANSCDP+xml" && $rb =~ "Keepalive") {
        route(check_keepalive);
        exit;
    }
    if (is_myself("$td") && !is_myself("$fd")) {
        route(device_response);
    } else {
        route(platform_query);
    }
    return 1;
}

route[check_keepalive] {
    $var(device_id) = $fU;
    if ($var(device_id) == "" || $var(device_id) == NULL) {
        $var(device_id) = $xml($rb/Notify/DeviceID.val);
    }
    if ($var(device_id) == "" || $var(device_id) == NULL) {
        xlog("L_WARN", "KEEPALIVE: cannot extract device ID\n");
        sl_send_reply(200, "OK");
        return;
    }

    xlog("L_INFO", "KEEPALIVE: device=$var(device_id)\n");
    $ru = "sip:" + $var(device_id) + "@" + $td;
    lookup("location");

    if ($rc > 0) {
        sl_send_reply(200, "OK");
    } else {
        # HA 模式：401 可能因同步滞后/主备切换
        xlog("L_WARN", "KEEPALIVE: device $var(device_id) NOT in local usrloc, may be sync gap or failover\n");
        sl_send_reply(401, "Not Registered");
    }
}

route[platform_query] {
    if (lookup("location")) {
        t_on_reply("handle_nat");
        t_relay();
        return 1;
    }
    sl_send_reply(404, "Device Not Found");
    return 1;
}

route[device_response] {
    if ($rb =~ "Catalog") {
        route(process_catalog);
    } else if ($rb =~ "DeviceInfo") {
        route(process_device_info);
    }
    append_hf("P-hint: outbound\r\n");
    t_on_reply("handle_nat");
    if (ds_select_dst(1, 0, "f"))
        t_relay();
    else
        sl_send_reply(503, "Service Unavailable");
    return 1;
}

########### Catalog 处理（HA 改造：HTTP 异步重放）##########

route[process_catalog] {
    $xml(cat) = $rb;
    $var(cnt) = 0;
    $var(i) = 0;

    while ($var(i) < 256) {
        $avp(chan_id) = $xml(cat/Response/DeviceList/Item[$var(i)]/DeviceID.val);
        if ($avp(chan_id) == NULL || $(avp(chan_id){s.len}) == 0)
            break;

        $avp(parent_id) = $xml(cat/Response/DeviceList/Item[$var(i)]/ParentID.val);
        if ($avp(chan_id) != $avp(parent_id)) {
            $avp(chan_name) = $xml(cat/Response/DeviceList/Item[$var(i)]/Name.val);
            $avp(chan_manufacturer) = $xml(cat/Response/DeviceList/Item[$var(i)]/Manufacturer.val);
            $avp(chan_model) = $xml(cat/Response/DeviceList/Item[$var(i)]/Model.val);
            $avp(recorder_contact) = "sip:" + $avp(chan_id) + "@" + $si + ":" + $sp;
            $avp(channel_ua) = $avp(chan_manufacturer) + " " + $avp(chan_model) + " (" + $avp(chan_name) + ")";
            $avp(channel_attr) = "parent=" + $fu;

            # 1. 本地写
            sql_query("DELETE FROM location WHERE username='" + $avp(chan_id) + "'");
            sql_query("INSERT INTO location (username, domain, contact, expires, q, callid, cseq, last_modified, flags, user_agent, socket, attr) "
                + "VALUES ('" + $avp(chan_id) + "', '" + $fd + "', '" + $avp(recorder_contact)
                + "', 1790000000, -1.0, '" + $ci + "', 9999, datetime('now', 'localtime'), 0, '"
                + $avp(channel_ua) + "', 'udp:" + $socket_in(ip) + ":" + $socket_in(port) + "', '"
                + $avp(channel_attr) + "')");
            $var(cnt) = $var(cnt) + 1;

            # 2. HA: HTTP 异步重放到对端
            if ($clustermode == 1) {
                $var(repl_delete) = "{\"op\":\"delete\",\"where\":{\"username\":\"" + $avp(chan_id) + "\"}}";
                $var(repl_insert) = "{\"op\":\"insert\",\"row\":{"
                    + "\"username\":\"" + $avp(chan_id) + "\","
                    + "\"domain\":\"" + $fd + "\","
                    + "\"contact\":\"" + $avp(recorder_contact) + "\","
                    + "\"user_agent\":\"" + $avp(channel_ua) + "\","
                    + "\"socket\":\"udp:" + $socket_in(ip) + ":" + $socket_in(port) + "\","
                    + "\"attr\":\"" + $avp(channel_attr) + "\","
                    + "\"callid\":\"" + $ci + "\""
                    + "}}";
                http_async_query("http://20.20.136.67:8080/replay/channel",
                    $var(repl_delete), "replay_del_" + $avp(chan_id));
                http_async_query("http://20.20.136.67:8080/replay/channel",
                    $var(repl_insert), "replay_ins_" + $avp(chan_id));
            }
        }
        $var(i) = $var(i) + 1;
    }
    xlog("L_INFO", "CATALOG: inserted $var(cnt) channels, replayed to peer\n");
    $xml(cat) = NULL;
    return 1;
}

route[process_device_info] {
    return 1;
}

########### INVITE 处理（与单机版一致）##########

route[invite] {
    do_accounting("log");
    if ((is_myself("$fd") || is_myself("$td")) && !is_myself("$rd") && $rU =~ "^[0-9]+$") {
        if (route(gb28181_playback)) {
            exit;
        }
        sl_send_reply(404, "Channel Not Found");
        return -1;
    }
    if (!lookup("location")) {
        t_reply(404, "Not Found");
        return -1;
    }
    do_accounting("log", "missed");
    route(forward);
    return 1;
}

route[gb28181_playback] {
    if (lookup("location")) {
        t_on_reply("handle_nat");
        t_relay();
        return 1;
    }
    return -1;
}

route[forward] {
    t_on_reply("handle_nat");
    if (!ds_select_dst(1, 0, "f")) {
        t_reply(503, "Service Unavailable");
        return -1;
    }
    t_relay();
    return 1;
}

########### 主路由 ##########

route {
    route(maxfwd);
    if ($rc < 0) exit;

    if (has_totag()) {
        route(in_dialog);
        exit;
    }

    route(dedup);

    if (is_method("CANCEL")) {
        forward();
        exit;
    }

    if (is_method("REGISTER")) {
        route(register);
        exit;
    }

    if (is_method("MESSAGE")) {
        route(message);
        exit;
    }

    if (is_method("INVITE")) {
        route(invite);
        exit;
    }

    if (is_method("PUBLISH|SUBSCRIBE")) {
        sl_send_reply(503, "Service Unavailable");
        exit;
    }

    if (!lookup("location", "method-filtering")) {
        t_reply(404, "Not Found");
        exit;
    }
    do_accounting("log", "missed");
    route(forward);
}

route[in_dialog] {
    if (is_method("ACK") && t_check_trans()) {
        t_relay();
        return 1;
    }
    if (!loose_route()) {
        sl_send_reply(404, "Not here");
        return -1;
    }
    if (is_method("BYE"))
        do_accounting("log", "failed");
    route(relay);
    return 1;
}

########### 回复路由 ##########

onreply_route[handle_nat] {
    if (t_check_status("200") && $mb =~ "application/sdp") {
        fix_nated_sdp("add-no-rtpproxy", "$socket_in(ip)", "\r\na=setup:active\r\na=connection:new");
    }
    fix_nated_contact();
}

########### 失败路由 ##########

failure_route[missed_call] {
    if (t_was_cancelled())
        exit;
}
